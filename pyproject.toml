[project]
name = "phone-harness"
version = "0.2.1"
description = "Let your agent control a real phone: iPhone (macOS via iPhone Mirroring, any OS over USB) or Android over adb"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["iphone", "android", "automation", "agent", "iphone-mirroring", "pymobiledevice3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # iPhone control (iPhone Mirroring, Vision OCR) needs macOS. Android is
    # plain adb and installs everywhere; these are skipped off macOS.
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# iPhone over USB from Linux, Windows or macOS through the CoreDevice
# services (no mirroring window). Needs Python 3.13+: older ssl modules
# cannot do the tunnel's TLS-PSK handshake. Pinned: the backend reaches into
# pymobiledevice3's screen-stream internals, which move between releases.
# pymobiledevice3 is GPL-3.0-or-later and runs in its own process (the
# session daemon); see THIRD-PARTY notes in install.md.
iphone = [
    "pymobiledevice3==11.13.1; python_version >= '3.13'",
    "rapidocr-onnxruntime>=1.4; sys_platform != 'darwin'",
]

[project.urls]
Homepage = "https://phone-harness.com"
Repository = "https://github.com/ShawnPana/phone-harness"
Issues = "https://github.com/ShawnPana/phone-harness/issues"

[project.scripts]
phone-harness = "phone_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_harness"]

# The skill text ships inside the package so `phone-harness skill` works
# from an installed wheel, not only from a checkout.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "phone_harness/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src/phone_harness", "SKILL.md", "onboarding.md", "README.md", "LICENSE", "install.md"]
