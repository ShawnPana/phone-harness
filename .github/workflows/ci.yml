# Installs on every OS and proves the Android path imports without Apple frameworks,
# and that the USB iPhone (CoreDevice) extra installs and its pure parts pass on 3.13.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install .
      - name: the CLI runs and the Android backend imports without pyobjc
        shell: bash
        run: |
          phone-harness skill > /dev/null
          python -c "import phone_harness.android, phone_harness.transport, phone_harness.config as c; print('default platform:', c.get('platform'))"
      - name: doctor names the adb install for this OS when adb is missing
        shell: bash
        run: |
          out=$(PHONE_HARNESS_PLATFORM=android phone-harness --doctor android 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "adb found"
      - name: off macOS, iPhone without the extra points at the extra
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python -c "
          import phone_harness.transport as t
          b = t.connect('ios')
          assert b.name == 'coredevice', b.name
          try:
              b.send('screen.bounds'); print('no session:', b.send('session.state'))
          except RuntimeError as e:
              print('ok:', e)
          "

  coredevice:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install ".[iphone]"
      - name: the daemon and backend import, and the pure parts pass
        shell: bash
        run: |
          python -c "import phone_harness.coredevice, phone_harness.coredevice_daemon, phone_harness.ocr as o; print('ocr engine:', o.engine())"
          python -m unittest discover -s tests -v
      - name: the doctor names the missing rung with no phone attached
        shell: bash
        run: |
          out=$(phone-harness --doctor coredevice 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "pymobiledevice3 installed"
