<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone</title>
<style>
  /* Tokens and rules copied from phone-cloud's globals.css so the two read
     as one product. Keep in step with frontend/src/styles/globals.css. */
  :root {
    --bg: #f6f7f1; --fg: #20231e; --muted: #72766d; --line: #c7cbc0; --soft: #eceee6;
    --accent: var(--fg);
    --danger: #924c43; --danger-soft: #f2e5e1; --positive: #42694f; --positive-soft: #e5ede4;
    --space: 24px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: Arial, Helvetica, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191c19; --fg: #e5e9df; --muted: #9da598; --line: #42483e; --soft: #252a24;
      --danger: #eaa49b; --danger-soft: #372925; --positive: #a5c5aa; --positive-soft: #25342a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191c19; --fg: #e5e9df; --muted: #9da598; --line: #42483e; --soft: #252a24;
    --danger: #eaa49b; --danger-soft: #372925; --positive: #a5c5aa; --positive-soft: #25342a;
    color-scheme: dark;
  }
  :root[data-theme="amber"] {
    --bg: #1c1911; --fg: #e3bf71; --muted: #b0996b; --line: #665836; --soft: #292316;
    --danger: #e1a089; --danger-soft: #392a20; --positive: #b7c28a; --positive-soft: #2b3020;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
               font-family: var(--sans); font-size: 13px; }
  body { height: 100dvh; overflow: hidden; background: var(--bg); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
           outline-offset: 4px; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: 0.45; }
  :focus-visible { outline: 2px solid var(--fg); }
  h1 { font-weight: 500; margin: 0; font-size: 23px; letter-spacing: -0.7px; }
  p { line-height: 1.6; margin: 0; }
  small { font-size: 11px; }
  svg { flex-shrink: 0; }

  .button { border: 1px solid var(--line); background: transparent; min-height: 38px; padding: 9px 13px;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            transition: background 140ms, color 140ms, border-color 140ms; font-size: 12px; border-radius: 0; }
  .button:hover:not(:disabled) { background: var(--soft); border-color: var(--fg); }
  .button[aria-pressed="true"] { background: var(--soft); }

  .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600;
           letter-spacing: -0.8px; white-space: nowrap; color: inherit; text-decoration: none; }
  .brand-mark { width: 32px; height: 32px; color: var(--accent); }

  .standalone-watch { height: 100dvh; display: flex; flex-direction: column; padding: var(--space); gap: var(--space); }
  .standalone-watch-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; min-height: 40px; }
  .standalone-watch-header p { color: var(--muted); }
  .standalone-watch-content { min-height: 0; flex: 1; display: flex; }
  .standalone-watch-content > .phone-viewer { width: 100%; }

  .phone-viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; width: 100%; height: 100%; position: relative; }
  .viewer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
                    margin-bottom: 10px; min-height: 28px; }
  .viewer-toolbar .button, .viewer-toolbar button { font-size: 10px; }
  .viewer-actions .button { min-height: 30px; padding: 6px 10px; }
  .viewer-label { font: 10px var(--mono); color: var(--muted); }
  .viewer-actions { display: flex; align-items: center; gap: 8px; }
  .viewer-notice { font: 11px/1.5 var(--mono); color: var(--muted); padding: 10px 0; margin: 0; }
  .viewer-notice[hidden] { display: none; }

  /* The stage: phone-cloud's viewer frame — a full-width black area with
     small mono captions in its corners and the phone centred inside. */
  .viewer-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center;
                  justify-content: center; background: #0a0a0a; padding: 40px 24px 24px; }
  .stage-caption { position: absolute; top: 12px; font: 10px var(--mono); color: #a3aaa6; letter-spacing: 0.2px; }
  .stage-caption.left { left: 12px; } .stage-caption.right { right: 12px; }
  /* The bezel phone-cloud's fixture viewer draws: dark frame, thin highlight,
     corners that follow the screen's shape. Sized by script to the stream. */
  .phone { flex: none; border: 3px solid #111415; outline: 1px solid #59615d; border-radius: 10% / 4.5%;
           background: #111415; overflow: hidden; }
  #screen { display: block; width: 100%; height: 100%; background: #000;
            touch-action: none; user-select: none; -webkit-user-select: none; }
  #screen:focus { outline: none; }
  .phone:has(#screen:focus-visible) { outline-color: #a3aaa6; }

  @media (max-width: 760px) { :root { --space: 20px; } }
  @media (max-width: 560px) { :root { --space: 16px; } .brand { font-size: 16px; gap: 8px; }
                              .brand-mark { width: 27px; height: 27px; } .viewer-label { font-size: 9px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main class="standalone-watch">
  <header class="standalone-watch-header">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">
        <path d="M3 2h2v1H3zM11 2h2v1h-2zM2 3h2v1H2zM5 3h1v1H5zM10 3h1v1h-1zM12 3h2v1h-2zM2 4h1v1H2zM6 4h4v1H6zM13 4h1v1h-1zM2 5h1v1H2zM13 5h1v1h-1zM3 6h2v1H3zM11 6h2v1h-2zM6 7h4v1H6zM5 8h6v1H5zM4 9h8v1H4zM4 10h8v1H4zM7 10h2v1H7zM4 11h8v1H4zM3 12h10v1H3zM3 13h10v1H3z"/>
        <rect x="6" y="9" width="4" height="4" fill="var(--bg)"/>
        <path d="M6 9h4v1H6zM6 12h4v1H6zM6 9h1v4H6zM9 9h1v4H9z"/>
      </svg>
      <span>phone-harness <small>local</small></span>
    </a>
    <div>
      <h1 id="device">__DEVICE__</h1>
      <p><span class="viewer-label" id="headline">__MODEL__ · iOS __IOS__ · <span id="state">connecting</span></span></p>
    </div>
  </header>
  <div class="standalone-watch-content">
    <div class="phone-viewer">
      <div class="viewer-toolbar">
        <span class="viewer-label" id="label">Local · 127.0.0.1 · click to tap, drag to swipe, scroll to scroll, type to type</span>
        <div class="viewer-actions">
          <button class="button" type="button" data-act="home">Home</button>
          <button class="button" type="button" data-act="rotate">Rotate</button>
          <button class="button" type="button" data-act="shot">Screenshot</button>
          <button class="button" type="button" data-act="volume-down">Vol −</button>
          <button class="button" type="button" data-act="volume-up">Vol +</button>
          <button class="button" type="button" data-act="lock">Lock</button>
        </div>
      </div>
      <p class="viewer-notice" id="notice" role="status">Connecting to the iPhone…</p>
      <div class="viewer-stage">
        <span class="stage-caption left">USB · __MODEL__ · iOS __IOS__</span>
        <span class="stage-caption right" id="caption">connecting</span>
        <div class="phone" id="phone">
          <canvas id="screen" width="750" height="1334" tabindex="0" aria-label="Live iPhone screen"></canvas>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
(() => {
  // ?theme=dark|light|amber pins a theme; otherwise the system setting decides.
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme) document.documentElement.dataset.theme = theme;

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const notice = document.getElementById('notice');
  const stateEl = document.getElementById('state');
  const phone = document.getElementById('phone');
  const stage = phone.parentElement;
  const post = (path, body) => fetch(path, { method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  const captionEl = document.getElementById('caption');
  const setState = (s, note) => { stateEl.textContent = s; captionEl.textContent = s;
    if (note === undefined) notice.hidden = true; else { notice.textContent = note; notice.hidden = false; } };

  // ---- layout: keep the phone's aspect inside the stage ----
  let vw = 750, vh = 1334;
  function layout() {
    const r = stage.getBoundingClientRect();
    const s = Math.min((r.width - 48) / vw, (r.height - 64) / vh);
    phone.style.width = Math.max(1, Math.floor(vw * s)) + 6 + 'px';    // + the 3px bezel each side
    phone.style.height = Math.max(1, Math.floor(vh * s)) + 6 + 'px';
  }
  addEventListener('resize', layout); requestAnimationFrame(layout);

  // ---- video: /codec then /stream.bin (length-prefixed NALUs) → VideoDecoder → canvas ----
  async function codecInfo() {
    for (let i = 0; i < 60; i++) {
      try {
        const r = await fetch('/codec', { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          if (j.codec && j.description)
            return { codec: j.codec.trim(), description: Uint8Array.from(atob(j.description), c => c.charCodeAt(0)) };
        }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 500));
    }
    throw new Error('The stream did not start. Is the phone unlocked and plugged in?');
  }
  let decoder, decoderConfig, needKey = true;
  function newDecoder() {
    decoder = new VideoDecoder({
      output: frame => {
        if (frame.displayWidth !== vw || frame.displayHeight !== vh) {
          vw = frame.displayWidth; vh = frame.displayHeight;
          canvas.width = vw; canvas.height = vh; layout();
        }
        ctx.drawImage(frame, 0, 0, vw, vh); frame.close();
        if (stateEl.textContent !== 'streaming') setState('streaming');
      },
      error: () => { needKey = true; },
    });
    decoder.configure(decoderConfig);
  }
  async function video() {
    const info = await codecInfo();
    decoderConfig = { codec: info.codec, description: info.description, optimizeForLatency: true };
    const sup = await VideoDecoder.isConfigSupported(decoderConfig);
    if (!sup.supported) { setState('unsupported', 'This browser cannot decode HEVC. Safari or Chrome with hardware video works.'); return; }
    newDecoder();
    let ts = 0;
    for (;;) {
      let resp = null;
      for (let i = 0; i < 20 && !resp; i++) {
        try { const r = await fetch('/stream.bin', { cache: 'no-store' }); if (r.ok) resp = r; } catch (e) {}
        if (!resp) await new Promise(r => setTimeout(r, 500));
      }
      if (!resp) { setState('disconnected', 'Lost the stream. Is the phone still connected? `phone-harness ios` shows the session.'); return; }
      const reader = resp.body.getReader();
      let buf = new Uint8Array(0);
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const m = new Uint8Array(buf.length + value.length); m.set(buf); m.set(value, buf.length); buf = m;
        while (buf.length >= 5) {
          const len = (buf[0] << 24) | (buf[1] << 16) | (buf[2] << 8) | buf[3];
          if (buf.length < 4 + len) break;
          const type = buf[4], data = buf.slice(5, 4 + len);
          buf = buf.subarray(4 + len);
          const key = type === 0 || type === 2;
          if (type === 2 || (key && needKey && decoder.state !== 'configured')) { try { decoder.close(); } catch (e) {} newDecoder(); }
          if (key) needKey = false;
          if (needKey) continue;
          try { decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: ts, data })); ts += 16666; }
          catch (e) { needKey = true; }
        }
      }
      needKey = true; setState('reconnecting', 'The stream restarted; picking it back up…');
    }
  }
  video().catch(e => setState('unavailable', e.message));

  // ---- the phone is the interface ----
  const hid = (e) => {
    const r = canvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    return { x: Math.round(x * 65535), y: Math.round(y * 65535) };
  };
  let down = false, lastMove = 0;
  canvas.addEventListener('pointerdown', e => { canvas.focus(); down = true; canvas.setPointerCapture(e.pointerId);
    post('/touch', { type: 'contact', ...hid(e) }); });
  canvas.addEventListener('pointermove', e => {
    if (!down) return;
    const now = performance.now(); if (now - lastMove < 12) return; lastMove = now;
    post('/touch', { type: 'contact', ...hid(e) }); });
  const lift = e => { if (!down) return; down = false; post('/touch', { type: 'release', ...hid(e) }); };
  canvas.addEventListener('pointerup', lift); canvas.addEventListener('pointercancel', lift);

  // Scroll wheel → a finger drag with a rest at the end (no fling).
  let scrolling = false, pending = 0;
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); pending += e.deltaY;
    if (scrolling) return; scrolling = true;
    (async () => {
      while (Math.abs(pending) > 2) {
        const amount = Math.max(-300, Math.min(300, pending)); pending = 0;
        const p = hid(e), steps = 8, dy = -amount / canvas.getBoundingClientRect().height * 65535;
        const y0 = Math.max(6553, Math.min(58981, p.y));
        await post('/touch', { type: 'contact', x: p.x, y: y0 });
        for (let i = 1; i <= steps; i++) { await new Promise(r => setTimeout(r, 14));
          await post('/touch', { type: 'contact', x: p.x, y: Math.round(y0 + dy * i / steps) }); }
        await new Promise(r => setTimeout(r, 120));
        await post('/touch', { type: 'release', x: p.x, y: Math.round(y0 + dy) });
      }
      scrolling = false;
    })();
  }, { passive: false });

  // Keyboard → HID usages (the full set held down, as the server expects).
  const CODES = { Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Space: 44, Minus: 45, Equal: 46,
    BracketLeft: 47, BracketRight: 48, Backslash: 49, Semicolon: 51, Quote: 52, Backquote: 53,
    Comma: 54, Period: 55, Slash: 56, CapsLock: 57, Delete: 76, Home: 74, End: 77, PageUp: 75, PageDown: 78,
    ArrowRight: 79, ArrowLeft: 80, ArrowDown: 81, ArrowUp: 82,
    ControlLeft: 224, ShiftLeft: 225, AltLeft: 226, MetaLeft: 227,
    ControlRight: 228, ShiftRight: 229, AltRight: 230, MetaRight: 231 };
  for (let i = 0; i < 26; i++) CODES['Key' + String.fromCharCode(65 + i)] = 4 + i;
  for (let i = 1; i <= 9; i++) CODES['Digit' + i] = 29 + i; CODES.Digit0 = 39;
  for (let i = 1; i <= 12; i++) CODES['F' + i] = 57 + i;
  const held = new Set(); let keyChain = Promise.resolve();
  const sendKeys = () => { const snap = [...held]; keyChain = keyChain.then(() => post('/key', { usages: snap })); };
  canvas.addEventListener('keydown', e => { const u = CODES[e.code]; if (u === undefined) return;
    e.preventDefault(); if (!held.has(u)) { held.add(u); sendKeys(); } });
  canvas.addEventListener('keyup', e => { const u = CODES[e.code]; if (u === undefined) return;
    e.preventDefault(); if (held.delete(u)) sendKeys(); });
  canvas.addEventListener('blur', () => { if (held.size) { held.clear(); sendKeys(); } });

  // ---- toolbar ----
  document.querySelector('.viewer-actions').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'rotate') return post('/rotate', { direction: 'left' });
    if (act === 'shot') return canvas.toBlob(blob => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'iphone-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000); }, 'image/png');
    post('/button', { name: act, state: 'press' });
  });
  canvas.focus();
})();
</script>
</body>
</html>
