<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
               font: 13px -apple-system, system-ui, sans-serif; color: #ddd; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  /* The phone: a bezel exactly around the live screen. Nothing else. */
  #phone { position: relative; background: #000; padding: 10px;
           border-radius: 44px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
           outline: 1px solid #2a2a2a; }
  #screen { display: block; border-radius: 34px; background: #000; cursor: default;
            touch-action: none; user-select: none; -webkit-user-select: none; }
  #screen:focus { outline: none; }
  #status { position: absolute; inset: 10px; display: grid; place-items: center;
            color: #888; border-radius: 34px; pointer-events: none; text-align: center; }
  #status.hidden { display: none; }
  /* Slim hover bar under the screen. Fades unless the mouse moves. */
  #bar { position: absolute; left: 50%; bottom: -46px; transform: translateX(-50%);
         display: flex; gap: 6px; padding: 5px; border-radius: 12px;
         background: rgba(30,30,30,.92); border: 1px solid #333;
         opacity: 0; transition: opacity .25s; }
  #bar.show { opacity: 1; }
  #bar button { all: unset; width: 34px; height: 30px; border-radius: 8px; display: grid;
                place-items: center; cursor: pointer; color: #ccc; }
  #bar button:hover { background: #333; color: #fff; }
  #bar button:active { background: #444; }
  #bar svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
             stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <canvas id="screen" width="750" height="1334" tabindex="0"></canvas>
    <div id="status">Connecting to iPhone…</div>
    <div id="bar">
      <button data-act="home" title="Home"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="4"/></svg></button>
      <button data-act="rotate" title="Rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
      <button data-act="shot" title="Save screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button data-act="volume-down" title="Volume down"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/></svg></button>
      <button data-act="volume-up" title="Volume up"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      <button data-act="lock" title="Lock"><svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/></svg></button>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const status = document.getElementById('status');
  const phone = document.getElementById('phone');
  const bar = document.getElementById('bar');
  const post = (path, body) => fetch(path, { method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});

  // ---- layout: the canvas keeps the phone's aspect and fills the window ----
  let vw = 750, vh = 1334;                       // video dimensions
  function layout() {
    const pad = 20, barRoom = 60;
    const maxW = innerWidth - pad * 2 - 20, maxH = innerHeight - pad * 2 - barRoom;
    const s = Math.min(maxW / vw, maxH / vh);
    canvas.style.width = Math.round(vw * s) + 'px';
    canvas.style.height = Math.round(vh * s) + 'px';
    const r = Math.round(Math.min(vw, vh) * s * 0.12);
    phone.style.borderRadius = (r + 10) + 'px';
    canvas.style.borderRadius = status.style.borderRadius = r + 'px';
  }
  addEventListener('resize', layout); layout();

  // ---- video: /codec then /stream.bin (length-prefixed NALUs) → VideoDecoder → canvas ----
  async function codecInfo() {
    for (let i = 0; i < 60; i++) {
      try {
        const r = await fetch('/codec', { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          if (j.codec && j.description)
            return { codec: j.codec.trim(), description: Uint8Array.from(atob(j.description), c => c.charCodeAt(0)) };
        }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 500));
    }
    throw new Error('the stream did not start');
  }
  let decoder, decoderConfig, needKey = true;
  function newDecoder() {
    decoder = new VideoDecoder({
      output: frame => {
        if (frame.displayWidth !== vw || frame.displayHeight !== vh) {
          vw = frame.displayWidth; vh = frame.displayHeight;
          canvas.width = vw; canvas.height = vh; layout();
        }
        ctx.drawImage(frame, 0, 0, vw, vh); frame.close();
        status.classList.add('hidden');
      },
      error: e => { needKey = true; },
    });
    decoder.configure(decoderConfig);
  }
  async function video() {
    const info = await codecInfo();
    decoderConfig = { codec: info.codec, description: info.description, optimizeForLatency: true };
    const sup = await VideoDecoder.isConfigSupported(decoderConfig);
    if (!sup.supported) { status.textContent = 'This browser cannot decode HEVC. Try Safari or Chrome.'; return; }
    newDecoder();
    let ts = 0;
    for (;;) {
      let resp = null;
      for (let i = 0; i < 20 && !resp; i++) {
        try { const r = await fetch('/stream.bin', { cache: 'no-store' }); if (r.ok) resp = r; } catch (e) {}
        if (!resp) await new Promise(r => setTimeout(r, 500));
      }
      if (!resp) { status.textContent = 'Lost the stream. Is the phone still connected?'; status.classList.remove('hidden'); return; }
      const reader = resp.body.getReader();
      let buf = new Uint8Array(0);
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const m = new Uint8Array(buf.length + value.length); m.set(buf); m.set(value, buf.length); buf = m;
        while (buf.length >= 5) {
          const len = (buf[0] << 24) | (buf[1] << 16) | (buf[2] << 8) | buf[3];
          if (buf.length < 4 + len) break;
          const type = buf[4], data = buf.slice(5, 4 + len);
          buf = buf.subarray(4 + len);
          const key = type === 0 || type === 2;
          if (type === 2 || (key && needKey && decoder.state !== 'configured')) { try { decoder.close(); } catch (e) {} newDecoder(); }
          if (key) needKey = false;
          if (needKey) continue;
          try { decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: ts, data })); ts += 16666; }
          catch (e) { needKey = true; }
        }
      }
      needKey = true;                            // the server restarted; wait for a key
    }
  }
  video().catch(e => { status.textContent = e.message; status.classList.remove('hidden'); });

  // ---- the phone is the interface ----
  const hid = (e) => {
    const r = canvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    return { x: Math.round(x * 65535), y: Math.round(y * 65535) };
  };
  let down = false, lastMove = 0;
  canvas.addEventListener('pointerdown', e => { canvas.focus(); down = true; canvas.setPointerCapture(e.pointerId);
    post('/touch', { type: 'contact', ...hid(e) }); });
  canvas.addEventListener('pointermove', e => {
    if (!down) return;
    const now = performance.now(); if (now - lastMove < 12) return; lastMove = now;
    post('/touch', { type: 'contact', ...hid(e) }); });
  const lift = e => { if (!down) return; down = false; post('/touch', { type: 'release', ...hid(e) }); };
  canvas.addEventListener('pointerup', lift); canvas.addEventListener('pointercancel', lift);

  // Scroll wheel → a finger drag with a rest at the end (no fling).
  let scrolling = false, pending = 0;
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); pending += e.deltaY;
    if (scrolling) return; scrolling = true;
    (async () => {
      while (Math.abs(pending) > 2) {
        const amount = Math.max(-300, Math.min(300, pending)); pending = 0;
        const p = hid(e), steps = 8, dy = -amount / canvas.getBoundingClientRect().height * 65535;
        const y0 = Math.max(6553, Math.min(58981, p.y));
        await post('/touch', { type: 'contact', x: p.x, y: y0 });
        for (let i = 1; i <= steps; i++) { await new Promise(r => setTimeout(r, 14));
          await post('/touch', { type: 'contact', x: p.x, y: Math.round(y0 + dy * i / steps) }); }
        await new Promise(r => setTimeout(r, 120));
        await post('/touch', { type: 'release', x: p.x, y: Math.round(y0 + dy) });
      }
      scrolling = false;
    })();
  }, { passive: false });

  // Keyboard → HID usages (full set held down, as the server expects).
  const CODES = { Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Space: 44, Minus: 45, Equal: 46,
    BracketLeft: 47, BracketRight: 48, Backslash: 49, Semicolon: 51, Quote: 52, Backquote: 53,
    Comma: 54, Period: 55, Slash: 56, CapsLock: 57, Delete: 76, Home: 74, End: 77, PageUp: 75, PageDown: 78,
    ArrowRight: 79, ArrowLeft: 80, ArrowDown: 81, ArrowUp: 82,
    ControlLeft: 224, ShiftLeft: 225, AltLeft: 226, MetaLeft: 227,
    ControlRight: 228, ShiftRight: 229, AltRight: 230, MetaRight: 231 };
  for (let i = 0; i < 26; i++) CODES['Key' + String.fromCharCode(65 + i)] = 4 + i;
  for (let i = 1; i <= 9; i++) CODES['Digit' + i] = 29 + i; CODES.Digit0 = 39;
  for (let i = 1; i <= 12; i++) CODES['F' + i] = 57 + i;
  const held = new Set(); let keyChain = Promise.resolve();
  const sendKeys = () => { const snap = [...held]; keyChain = keyChain.then(() => post('/key', { usages: snap })); };
  canvas.addEventListener('keydown', e => { const u = CODES[e.code]; if (u === undefined) return;
    e.preventDefault(); if (!held.has(u)) { held.add(u); sendKeys(); } });
  canvas.addEventListener('keyup', e => { const u = CODES[e.code]; if (u === undefined) return;
    e.preventDefault(); if (held.delete(u)) sendKeys(); });
  canvas.addEventListener('blur', () => { if (held.size) { held.clear(); sendKeys(); } });

  // ---- hover bar ----
  let hideTimer;
  addEventListener('pointermove', () => { bar.classList.add('show'); clearTimeout(hideTimer);
    hideTimer = setTimeout(() => bar.classList.remove('show'), 1800); });
  bar.addEventListener('pointerenter', () => clearTimeout(hideTimer));
  bar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'rotate') return post('/rotate', { direction: 'left' });
    if (act === 'shot') return canvas.toBlob(blob => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'iphone-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000); }, 'image/png');
    post('/button', { name: act, state: 'press' });
  });
  canvas.focus();
})();
</script>
</body>
</html>
